[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CANN_torch"
version = "0.1.0"
description = "A library for implementing Constitutive Artificial Neural Networks"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "torch>=1.9.0",
    "numpy>=1.19.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scikit-learn>=0.24.0",
]
requires-python = ">=3.8"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["CANN_torch", "CANN_torch.core", "CANN_torch.models", "CANN_torch.utils", "CANN_torch.pipeline"]

[tool.setuptools.package-data]
CANN_torch = ["*.py"]
CANN_torch.models = ["*.py"]
CANN_torch.core = ["*.py"]
CANN_torch.utils = ["*.py"]
CANN_torch.pipeline = ["*.py"]

[tool.setuptools.exclude-package-data]
CANN_torch = [
    "*.pyc",
    "*.pyo",
    "*.pyd",
    ".Python",
    "build",
    "develop-eggs",
    "dist",
    "downloads",
    "eggs",
    ".eggs",
    "lib",
    "lib64",
    "parts",
    "sdist",
    "var",
    "wheels",
    "*.egg-info",
    ".installed.cfg",
    "*.egg",
    ".ipynb_checkpoints",
    ".vscode",
    ".idea",
    "*.csv",
    "*.xlsx",
    "*.xls",
    "*.dat",
    "*.txt",
    "*.pth",
    "*.onnx",
    "*.h5",
    "*.hdf5",
    "*.log",
    "logs",
] 